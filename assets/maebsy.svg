<svg width="1500" height="1000" viewBox="0 0 1500 1000"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .cursor {
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="terminalClip">
      <rect width="1500" height="1000" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#terminalClip)">

    <!-- Background -->
    <rect width="1500" height="1000" fill="#111111"/>

    <!-- Title bar -->
    <rect width="1500" height="74" fill="#242424"/>

    <!-- Traffic lights -->
    <circle cx="34" cy="37" r="9" fill="#FF5F57"/>
    <circle cx="62" cy="37" r="9" fill="#FEBC2E"/>
    <circle cx="90" cy="37" r="9" fill="#28C840"/>

    <!-- Title -->
    <text
      x="750"
      y="46"
      text-anchor="middle"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="26"
      font-weight="600"
      fill="#D0D0D0">
      maebsy — zsh
    </text>


    <!-- WHOAMI -->
    <text
      x="55"
      y="140"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="34"
      font-weight="600"
      fill="#7CFF6B">
      $ whoami
    </text>

    <text
      x="55"
      y="200"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="50"
      font-weight="700"
      fill="#FFFFFF">
      Hi, I'm Min
    </text>

    <text
      x="55"
      y="247"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      Computer Science student building practical software with Python.
    </text>

    <text
      x="55"
      y="292"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      Interested in backend systems, data, cloud infrastructure, and financial technology.
    </text>


    <!-- FOCUS -->
    <text
      x="55"
      y="365"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="34"
      font-weight="600"
      fill="#7CFF6B">
      $ cat ~/focus
    </text>

    <text
      x="55"
      y="415"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      • Python &amp; backend development
    </text>

    <text
      x="55"
      y="460"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      • Data processing &amp; database systems
    </text>

    <text
      x="55"
      y="505"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      • Cloud infrastructure &amp; automation
    </text>

    <text
      x="55"
      y="550"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      • Financial technology &amp; algorithmic trading
    </text>

    <text
      x="55"
      y="595"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="29"
      fill="#F2F2F2">
      • Building reliable and practical systems
    </text>


    <!-- STACK -->
    <text
      x="55"
      y="665"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="34"
      font-weight="600"
      fill="#7CFF6B">
      $ ls ~/stack
    </text>

    <text
      x="55"
      y="715"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="28"
      fill="#F2F2F2">
      Languages: Python · JavaScript · HTML · CSS · SQL
    </text>

    <text
      x="55"
      y="760"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="28"
      fill="#F2F2F2">
      Backend &amp; Data: FastAPI · AsyncIO · PostgreSQL · SQLite · Pandas · Parquet
    </text>

    <text
      x="55"
      y="805"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="28"
      fill="#F2F2F2">
      Cloud &amp; DevOps: AWS · Linux · Docker · Git · GitHub
    </text>

    <text
      x="55"
      y="850"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="28"
      fill="#F2F2F2">
      Exploring: Cloud Architecture · System Design · Algorithmic Trading
    </text>


    <!-- FINAL PROMPT -->
    <text
      x="55"
      y="930"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="34"
      font-weight="600"
      fill="#7CFF6B">
      $ maebsy@github
    </text>

    <text
      class="cursor"
      x="350"
      y="930"
      font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="34"
      font-weight="600"
      fill="#7CFF6B">
      _
    </text>

  </g>

  <!-- Rounded outer border -->
  <rect
    width="1500"
    height="1000"
    rx="22"
    fill="none"
    stroke="#333333"
    stroke-width="1"/>

</svg>
